[package]
name = "the_machine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "the_machine"
path = "src/main.rs"

[[bin]]
name = "bond_pipeline"
path = "src/bin/bond_pipeline.rs"

[[bin]]
name = "jump_box"
path = "src/bin/jump_box.rs"

[[bin]]
name = "attack_experiment"
path = "src/bin/attack_experiment.rs"

[[bin]]
name = "diagnose_experiment"
path = "src/bin/diagnose_experiment.rs"

[[bin]]
name = "learn_diagnose"
path = "src/bin/learn_diagnose.rs"

[[bin]]
name = "fifty_episodes"
path = "src/bin/fifty_episodes.rs"

[[bin]]
name = "autonomy_experiment"
path = "src/bin/autonomy_experiment.rs"

[[bin]]
name = "validate_autonomy"
path = "src/bin/validate_autonomy.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
scraper = "0.18"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
chrono = "0.4"
uuid = { version = "1.6", features = ["v4"] }
url = "2.4"
syn = { version = "2.0", features = ["full", "visit", "extra-traits"] }
quote = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
libloading = "0.8"
log = "0.4"
env_logger = "0.10"

[features]
default = []
cuda = []

