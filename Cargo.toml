[package]
name = "the_machine"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "the_machine"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
scraper = "0.18"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hmac = "0.12"
chrono = "0.4"

